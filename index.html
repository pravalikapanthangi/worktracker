<!DOCTYPE html>
<html>
<head>
<title>Work Tracker PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;font-family:sans-serif;}
.glass {background:rgba(255,255,255,0.1);padding:20px;margin-top:20px;border-radius:15px;}
.task {background:white;color:black;padding:15px;margin:10px;border-radius:10px;}
.hidden{display:none;}
.overload{color:red;font-weight:bold;}
</style>
</head>

<body class="container">

<h2 class="text-center mt-4">🚀 Work Tracker PRO MAX</h2>

<!-- LOGIN -->
<div id="login" class="glass">
<h4>Login / Signup</h4>
<input id="username" class="form-control mb-2" placeholder="Username">
<input id="password" type="password" class="form-control mb-2" placeholder="Password">

<select id="roleSelect" class="form-control mb-2">
<option value="member">Member</option>
<option value="admin">Admin</option>
</select>

<button onclick="login()" class="btn btn-primary">Login</button>
<button onclick="signup()" class="btn btn-success">Signup</button>

<p id="authMsg"></p>
</div>

<!-- ADMIN -->
<div id="admin" class="glass hidden">

<div class="d-flex justify-content-between">
<h4>Admin Dashboard</h4>
<button onclick="logout()" class="btn btn-danger">Logout</button>
</div>

<h5>Create Task</h5>
<input id="title" class="form-control mb-2" placeholder="Task Title">
<input id="desc" class="form-control mb-2" placeholder="Description">

<select id="assign" class="form-control mb-2"></select>

<select id="priority" class="form-control mb-2">
<option>High</option><option>Medium</option><option>Low</option>
</select>

<input id="depId" class="form-control mb-2" placeholder="Dependency Task ID">
<input id="depPer" class="form-control mb-2" placeholder="Required %">

<button onclick="addTask()" class="btn btn-warning">Create Task</button>

<h5 id="suggest"></h5>
<h5 id="alerts"></h5>
<h5 id="workload"></h5>

<div id="adminTasks"></div>

<canvas id="chart"></canvas>

</div>

<!-- MEMBER -->
<div id="member" class="glass hidden">

<div class="d-flex justify-content-between">
<h4>Member Dashboard</h4>
<button onclick="logout()" class="btn btn-danger">Logout</button>
</div>

<div id="memberTasks"></div>

</div>

<script>

// INIT USERS
if(!localStorage.getItem("users")){
localStorage.setItem("users", JSON.stringify([
{username:"admin",password:"admin123",role:"admin"}
]));
}

let users = JSON.parse(localStorage.getItem("users"));
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;

// LOGIN
function login(){
let u = users.find(x=>x.username===username.value);

if(!u){ authMsg.innerText="❌ User not found"; return; }
if(u.password!==password.value){ authMsg.innerText="❌ Wrong password"; return; }

currentUser=u;
localStorage.setItem("currentUser", JSON.stringify(u));

authMsg.innerText="✅ Login success";

if(u.role==="admin") show("admin");
else show("member");

render();
}

// SIGNUP
function signup(){
let uname=username.value.trim();
let pass=password.value.trim();
let role=roleSelect.value;

if(!uname||!pass){ authMsg.innerText="⚠ Fill all fields"; return; }
if(users.find(u=>u.username===uname)){ authMsg.innerText="❌ Username exists"; return; }

users.push({username:uname,password:pass,role});
localStorage.setItem("users",JSON.stringify(users));

authMsg.innerText="✅ Account created";
}

// LOGOUT
function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

// SHOW
function show(id){
["login","admin","member"].forEach(x=>document.getElementById(x).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

// SAVE
function save(){
localStorage.setItem("tasks",JSON.stringify(tasks));
}

// LOAD USERS
function loadUsers(){
assign.innerHTML="";
users.filter(u=>u.role==="member").forEach(u=>{
let opt=document.createElement("option");
opt.value=u.username;
opt.innerText=u.username;
assign.appendChild(opt);
});
}

// DEPENDENCY CHECK
function canStart(t){
if(!t.dependency) return true;
let d=tasks.find(x=>x.id==t.dependency.taskId);
return d && d.progress>=t.dependency.requiredPercent;
}

// CYCLE CHECK
function cycle(id,dep){
if(id==dep) return true;
let d=tasks.find(x=>x.id==dep);
if(!d||!d.dependency) return false;
return cycle(id,d.dependency.taskId);
}

// ADD TASK
function addTask(){

// SIMPLE SUGGESTION
let workloadCount={};
users.forEach(u=>workloadCount[u.username]=0);
tasks.forEach(t=>workloadCount[t.assigned]++);

let suggested = Object.keys(workloadCount).reduce((a,b)=>workloadCount[a]<workloadCount[b]?a:b);
suggest.innerText="💡 Suggested: "+suggested;

let t={
id:Date.now(),
title:title.value,
description:desc.value,
assigned:assign.value,
priority:priority.value,
progress:0,
blocked:false,
blockReason:"",
notes:"",
dependency: depId.value ? {
taskId:Number(depId.value),
requiredPercent:Number(depPer.value)
}:null
};

if(t.dependency && cycle(t.id,t.dependency.taskId)){
alert("❌ Circular dependency!");
return;
}

tasks.push(t);
save();
render();
}

// UPDATE
function update(id,val){
let t=tasks.find(x=>x.id==id);

if(t.blocked){alert("Blocked");return;}
if(!canStart(t)){alert("Dependency incomplete");return;}

t.progress=Number(val);

// CASCADE ALERT
tasks.forEach(x=>{
if(x.dependency && x.dependency.taskId==t.id){
if(canStart(x)){
alerts.innerHTML+="<br>✅ "+x.title+" unblocked!";
}
}
});

save();
render();
}

// BLOCK
function toggleBlock(id){
let t=tasks.find(x=>x.id==id);
t.blocked=!t.blocked;
t.blockReason=t.blocked?prompt("Reason:"):"";
save();render();
}

// NOTES
function addNote(id){
let t=tasks.find(x=>x.id==id);
t.notes=prompt("Update:",t.notes);
save();render();
}

// RENDER
function render(){

loadUsers();

let adminHTML="",memberHTML="";
let workloadData={};

users.forEach(u=>workloadData[u.username]=0);

tasks.forEach(t=>{
workloadData[t.assigned]++;

let ready=canStart(t)&&!t.blocked;

// BOTTLENECK ALERT
if(!ready){
alerts.innerHTML="⚠ Bottlenecks detected!";
}

// IMPACT
let impacted=tasks.filter(x=>x.dependency && x.dependency.taskId==t.id);
let impactText=impacted.map(i=>i.title).join(",");

// CARD
let card=`
<div class="task">
<h5>${t.title}</h5>
<p>${t.description}</p>
<p>👤 ${t.assigned}</p>
<p>⚡ ${t.priority}</p>

<p>Status: ${ready?"Ready":"Blocked"}</p>

<p>Impact: ${impactText||"None"}</p>

<input type="range" min="0" max="100" value="${t.progress}"
onchange="update(${t.id},this.value)">
<p>${t.progress}%</p>

${t.blocked?`<p>🚫 ${t.blockReason}</p>`:""}

<button onclick="toggleBlock(${t.id})">Block</button>
<button onclick="addNote(${t.id})">Note</button>

<p>${t.notes}</p>
</div>
`;

adminHTML+=card;

if(currentUser.role==="member" && currentUser.username===t.assigned){
memberHTML+=card;
}
});

// WORKLOAD VIEW
let wHTML="";
for(let u in workloadData){
let cls=workloadData[u]>3?"overload":"";
wHTML+=`<p class="${cls}">${u}: ${workloadData[u]} tasks</p>`;
}
workload.innerHTML=wHTML;

// DISPLAY
adminTasks.innerHTML=adminHTML;
memberTasks.innerHTML=memberHTML;

// FIX CHART
if(window.myChart) window.myChart.destroy();

window.myChart = new Chart(chart,{
type:"bar",
data:{
labels:Object.keys(workloadData),
datasets:[{data:Object.values(workloadData)}]
}
});
}

// AUTO LOGIN
if(currentUser){
if(currentUser.role==="admin") show("admin");
else show("member");
}

render();

</script>

</body>
</html>
